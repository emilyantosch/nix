# Rendered by caelestia into ~/.local/state/caelestia/theme/tmux.conf on every
# scheme change and sourced into running servers. Same layout as the gruvbox
# plugin, which it overrides.
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 80
set -g status-left-style none
set -g status-right-style none
setw -g window-status-separator ""

set -g status-style "bg=#{{ surfaceContainer.hex }},fg=#{{ onSurface.hex }}"
setw -g window-status-style "bg=#{{ surfaceContainer.hex }},fg=#{{ onSurfaceVariant.hex }}"
setw -g window-status-current-style "bg=#{{ surfaceContainer.hex }},fg=#{{ onSurface.hex }}"
setw -g window-status-activity-style "bg=#{{ surfaceContainer.hex }},fg=#{{ tertiary.hex }}"
setw -g window-status-bell-style "bg=#{{ error.hex }},fg=#{{ onError.hex }}"

set -g pane-border-style "fg=#{{ outlineVariant.hex }}"
set -g pane-active-border-style "fg=#{{ primary.hex }}"
set -g popup-border-style "fg=#{{ primary.hex }}"
set -g message-style "bg=#{{ surfaceContainerHighest.hex }},fg=#{{ onSurface.hex }}"
set -g message-command-style "bg=#{{ secondary.hex }},fg=#{{ onSecondary.hex }}"
setw -g mode-style "bg=#{{ secondaryContainer.hex }},fg=#{{ onSecondaryContainer.hex }}"
set -g display-panes-active-colour "#{{ primary.hex }}"
set -g display-panes-colour "#{{ outline.hex }}"
setw -g clock-mode-colour "#{{ primary.hex }}"

set -g status-left "#[bg=#{{ tertiary.hex }},fg=#{{ onTertiary.hex }},bold] #S #[bg=#{{ surfaceContainer.hex }},fg=#{{ tertiary.hex }},nobold]"
set -g status-right "#[bg=#{{ surfaceContainer.hex }},fg=#{{ surfaceContainerHighest.hex }}]#[bg=#{{ surfaceContainerHighest.hex }},fg=#{{ onSurfaceVariant.hex }}] %Y-%m-%d  %H:%M #[bg=#{{ surfaceContainerHighest.hex }},fg=#{{ secondary.hex }}]#[bg=#{{ secondary.hex }},fg=#{{ onSecondary.hex }}] #h "
setw -g window-status-format "#[bg=#{{ surfaceContainerHighest.hex }},fg=#{{ surfaceContainer.hex }}]#[fg=#{{ onSurfaceVariant.hex }}] #I  #W #[bg=#{{ surfaceContainer.hex }},fg=#{{ surfaceContainerHighest.hex }}]"
setw -g window-status-current-format "#[bg=#{{ primary.hex }},fg=#{{ surfaceContainer.hex }}]#[fg=#{{ onPrimary.hex }}] #I  #[bold]#W#{?window_zoomed_flag,*Z,} #[bg=#{{ surfaceContainer.hex }},fg=#{{ primary.hex }},nobold]"
